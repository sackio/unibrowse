<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>rrweb Player</title>
  <link rel="stylesheet" href="/public/rrweb.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
    #rrweb-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #status {
      position: fixed;
      top: 8px; left: 8px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font: 12px/1.4 monospace;
      padding: 6px 10px;
      border-radius: 4px;
      z-index: 9999;
    }
    /* Selector highlight overlay */
    #selector-highlight {
      position: fixed;
      pointer-events: none;
      border: 3px solid #ff4444;
      box-shadow: 0 0 0 2px rgba(255,68,68,0.3), inset 0 0 0 2px rgba(255,68,68,0.1);
      border-radius: 2px;
      z-index: 9998;
      display: none;
      transition: all 0.1s;
    }
  </style>
</head>
<body>
  <div id="rrweb-container"></div>
  <div id="status">Loading…</div>
  <div id="selector-highlight"></div>

  <script src="/public/rrweb.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const recordingId = params.get('id');
    const targetTs = parseInt(params.get('t') || '0', 10);
    const selector = params.get('selector') || '';
    const statusEl = document.getElementById('status');
    const highlightEl = document.getElementById('selector-highlight');

    window.__playerReady = false;
    window.__elementBounds = null;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function init() {
      if (!recordingId) { setStatus('Error: no recording id'); return; }

      setStatus('Fetching recording…');
      const [metaResp, eventsResp] = await Promise.all([
        fetch(`/api/v1/recordings/${recordingId}`),
        fetch(`/api/v1/recordings/${recordingId}/events`),
      ]);

      const { recording } = await metaResp.json();
      const { rrwebEvents } = await eventsResp.json();

      if (!recording) { setStatus('Recording not found'); return; }
      if (!rrwebEvents || !rrwebEvents.length) { setStatus('No rrweb events'); return; }

      setStatus(`Loaded ${rrwebEvents.length} events, seeking…`);

      const startTime = recording.startTime;
      const offsetMs = targetTs > 0 ? Math.max(0, targetTs - startTime) : 0;

      // Size the container to match the recorded viewport (first snapshot)
      const firstSnap = rrwebEvents.find(e => e.type === 2);
      const vp = firstSnap?.data?.initialOffset || firstSnap?.data?.width
        ? { width: firstSnap.data.width, height: firstSnap.data.height }
        : { width: 1280, height: 800 };

      const container = document.getElementById('rrweb-container');
      // Scale to fit the window while preserving aspect ratio
      const scaleX = window.innerWidth / vp.width;
      const scaleY = window.innerHeight / vp.height;
      const scale = Math.min(scaleX, scaleY, 1);

      const replayer = new rrweb.Replayer(rrwebEvents, {
        root: container,
        speed: 1,
        skipInactive: true,
        showWarning: false,
        showDebug: false,
        blockClass: 'rr-block',
        liveMode: false,
        insertStyleRules: [],
      });

      // Scale the replayer iframe
      const playerDiv = container.querySelector('.replayer-wrapper') || container.firstElementChild;
      if (playerDiv) {
        playerDiv.style.transform = `scale(${scale})`;
        playerDiv.style.transformOrigin = 'top left';
      }

      // Seek to the target time offset
      replayer.pause(offsetMs);

      // Give the replayer a moment to render
      await new Promise(r => setTimeout(r, 600));

      // Apply selector highlight if requested
      if (selector) {
        try {
          const iframe = container.querySelector('iframe');
          if (iframe && iframe.contentDocument) {
            const el = iframe.contentDocument.querySelector(selector);
            if (el) {
              const iframeRect = iframe.getBoundingClientRect();
              const elRect = el.getBoundingClientRect();
              const bounds = {
                x: iframeRect.left + elRect.left * scale,
                y: iframeRect.top + elRect.top * scale,
                width: elRect.width * scale,
                height: elRect.height * scale,
              };
              window.__elementBounds = bounds;
              highlightEl.style.left = bounds.x + 'px';
              highlightEl.style.top = bounds.y + 'px';
              highlightEl.style.width = bounds.width + 'px';
              highlightEl.style.height = bounds.height + 'px';
              highlightEl.style.display = 'block';
              setStatus(`✓ ${selector} at (${Math.round(bounds.x)},${Math.round(bounds.y)})`);
            } else {
              setStatus(`Selector not found: ${selector}`);
            }
          }
        } catch (e) {
          setStatus(`Selector error: ${e.message}`);
        }
      } else {
        setStatus(`t=${offsetMs}ms`);
      }

      window.__playerReady = true;
    }

    init().catch(e => { setStatus('Error: ' + e.message); console.error(e); });
  </script>
</body>
</html>
