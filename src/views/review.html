<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Review</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .header a.back { color: #aaa; text-decoration: none; font-size: 18px; }
    .header a.back:hover { color: #fff; }
    .header h1 { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
    .header h1 .title-editable {
      display: inline-block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid transparent;
      border-radius: 2px;
      padding: 1px 4px;
      cursor: text;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }
    .header h1 .title-editable:hover { border-bottom-color: rgba(255,255,255,0.3); }
    .header h1 .title-editable:focus {
      border-bottom-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08);
      white-space: pre-wrap;
      overflow: visible;
      text-overflow: unset;
    }
    .header .title-saved { font-size: 11px; color: #aaa; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
    .header .title-saved.show { opacity: 1; }
    .header .meta { font-size: 12px; color: #999; white-space: nowrap; }
    .header button {
      padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      background: transparent; color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .header button:hover { background: rgba(255,255,255,0.1); }

    .header button.edit-btn { border-color: rgba(255,255,255,0.15); }

    /* ── Metadata Edit Bar ── */
    .meta-bar {
      display: none;
      background: #16213e;
      border-bottom: 1px solid #2a3f6f;
      padding: 10px 20px;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .meta-bar.open { display: flex; }
    .meta-bar input, .meta-bar textarea {
      border: 1px solid #2a3f6f;
      border-radius: 4px;
      background: #0f1a33;
      color: #e0e0e0;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .meta-bar input:focus, .meta-bar textarea:focus { outline: none; border-color: #6f42c1; }
    .meta-bar .title-input { flex: 2; }
    .meta-bar .desc-input { flex: 3; }
    .meta-bar .tags-input { flex: 1; }
    .meta-bar button.save-meta {
      padding: 6px 16px; background: #6f42c1; border: none; border-radius: 4px;
      color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap; flex-shrink: 0;
    }
    .meta-bar button.save-meta:hover { background: #5a32a3; }
    .meta-bar .meta-saved { font-size: 12px; color: #28a745; display: none; white-space: nowrap; }
    .meta-bar label { font-size: 11px; color: #6c8ebf; white-space: nowrap; flex-shrink: 0; }

    /* ── Main Layout ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 420px;
      grid-template-rows: 1fr;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Left Panel ── */
    .left-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #1a1a1a;
    }

    .video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 0;
      position: relative;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      outline: none;
    }

    .no-video {
      color: #555;
      text-align: center;
      padding: 40px;
    }
    .no-video p { font-size: 14px; }

    /* ── Tab Switcher ── */
    .tab-switcher {
      display: none;
      gap: 6px;
      padding: 6px 10px;
      background: #111;
      border-bottom: 1px solid #333;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .tab-video-btn {
      padding: 4px 10px;
      border: 1px solid #444;
      border-radius: 12px;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-video-btn:hover { border-color: #6f42c1; color: #fff; }
    .tab-video-btn.active { background: #6f42c1; border-color: #6f42c1; color: #fff; }

    /* ── Right Panel — Timeline ── */
    .right-panel {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-left: 1px solid #ddd;
      overflow: hidden;
    }

    .timeline-header {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      font-weight: 600;
      font-size: 13px;
      color: #555;
      background: #fafafa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
    }

    .timeline-filter {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 3px 7px;
      border: 1px solid #ddd;
      border-radius: 3px;
      background: #fff;
      font-size: 11px;
      cursor: pointer;
      color: #666;
    }
    .filter-btn.active { background: #6f42c1; border-color: #6f42c1; color: #fff; }

    .timeline {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .timeline-event {
      padding: 5px 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
      position: relative;
    }
    .timeline-event:hover { background: #f5f0ff; }
    .timeline-event.active { background: #f0ebff; border-left-color: #6f42c1; }
    .timeline-event.page-start { border-left-color: #28a745; }
    .timeline-event.ev-network { color: #0055aa; }
    .timeline-event.ev-rich-annotation { border-left-color: #ef4444; background: #fef2f2; }
    .timeline-event.ev-rich-annotation:hover { background: #fee2e2; }

    /* ── Rich annotation panel (drawing+screenshot+note+dom targets) ── */
    .rich-annot-panel {
      border-top: 2px solid #ef4444;
      padding: 10px 12px;
      background: #fef9f9;
      flex-shrink: 0;
      max-height: 50vh;
      overflow-y: auto;
    }
    .rich-annot-panel h3 {
      font-size: 13px; font-weight: 600; color: #b91c1c; margin: 0 0 8px 0;
      display: flex; align-items: center; gap: 6px;
    }
    .rich-annot-panel .close-x {
      margin-left: auto; cursor: pointer; color: #999; font-size: 18px; line-height: 1;
      background: none; border: none; padding: 0;
    }
    .rich-annot-panel .close-x:hover { color: #333; }
    .rich-annot-panel img.shot {
      max-width: 100%; max-height: 280px;
      border: 1px solid #ddd; border-radius: 4px; display: block;
      background: #f8f8f8;
    }
    .rich-annot-panel .note {
      font-size: 13px; color: #1f2937; padding: 6px 10px;
      background: #fff; border: 1px solid #fcd34d; border-radius: 4px;
      margin: 8px 0; white-space: pre-wrap;
    }
    .rich-annot-panel .targets { margin-top: 8px; }
    .rich-annot-panel .targets h4 {
      font-size: 11px; font-weight: 600; color: #555; margin: 0 0 4px 0;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .rich-annot-panel .targets ol { margin: 0; padding-left: 20px; font-size: 12px; }
    .rich-annot-panel .targets li { margin: 3px 0; }
    .rich-annot-panel .targets .tag {
      display: inline-block; background: #dbeafe; color: #1e40af;
      padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 11px;
      margin-right: 4px;
    }
    .rich-annot-panel .targets .selectors {
      font-family: monospace; font-size: 11px; color: #555; word-break: break-all;
    }
    .rich-annot-panel .targets .preview-text {
      font-size: 11px; color: #444; font-style: italic;
    }
    .rich-annot-panel .meta {
      font-size: 11px; color: #999; margin-bottom: 6px;
      display: flex; gap: 12px;
    }
    .timeline-event.ev-dom { color: #7f8c8d; opacity: 0.7; }
    .timeline-event.ev-interaction { color: #333; }
    .timeline-event.selected { background: #e8dfff; }

    .event-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .event-icon { font-size: 12px; flex-shrink: 0; width: 16px; text-align: center; color: #888; }
    .event-time { font-size: 11px; color: #999; flex-shrink: 0; width: 36px; font-variant-numeric: tabular-nums; }
    .event-label {
      font-size: 12px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      flex-shrink: 0;
      font-weight: 600;
    }
    .badge-ok { background: #d4edda; color: #155724; }
    .badge-err { background: #f8d7da; color: #721c24; }
    .badge-kind { background: #e8e0ff; color: #5a32a3; }

    /* Event detail — expands on click */
    .event-detail {
      display: none;
      margin-top: 5px;
      padding: 7px 10px;
      background: #f8f8ff;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #e0d8ff;
    }
    .event-detail.visible { display: block; }

    .detail-field { margin-bottom: 4px; }
    .detail-key { color: #6f42c1; font-weight: 600; }
    .detail-val { color: #333; }

    /* Annotation area */
    .annotation-panel {
      border-top: 1px solid #eee;
      padding: 10px 12px;
      flex-shrink: 0;
      background: #fafafa;
    }
    .annotation-panel label { font-size: 11px; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }
    .annotation-panel textarea {
      width: 100%;
      height: 56px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 12px;
      resize: none;
      font-family: inherit;
    }
    .annotation-panel textarea:focus { outline: none; border-color: #6f42c1; }
    .save-annotation-btn {
      margin-top: 5px;
      padding: 4px 12px;
      background: #6f42c1;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .save-annotation-btn:hover { background: #5a32a3; }
    .save-ok { color: #28a745; font-size: 11px; display: none; }

    /* Kind color coding */
    .kind-click { color: #c0392b; }
    .kind-input { color: #2980b9; }
    .kind-selection { color: #8e44ad; }
    .kind-copy { color: #16a085; }
    .kind-keypress { color: #d35400; }
    .kind-form { color: #27ae60; }
    .kind-dom   { color: #7f8c8d; }
    .kind-nav   { color: #8e44ad; }
    .kind-error { color: #e74c3c; font-weight: 600; }
    .kind-media { color: #2980b9; }
    .kind-page { color: #27ae60; }
    .kind-network { color: #2c3e50; }
    .kind-mouse { color: #bbb; font-size: 16px; line-height: 1; }
    .timeline-event.ev-mouse { opacity: 0.6; }
    .filter-btn.mouse-btn { border-style: dashed; }
  </style>
</head>
<body>
  <div class="header">
    <a href="/review" class="back">←</a>
    <h1 id="recording-title"><span class="title-editable" id="title-editable" contenteditable="true" spellcheck="false" data-placeholder="Untitled Session"></span></h1>
    <span class="title-saved" id="title-saved">Saved</span>
    <span class="meta" id="recording-meta"></span>
    <button class="edit-btn" onclick="toggleMetaBar()">✏ Details</button>
  </div>
  <div class="meta-bar" id="meta-bar">
    <label>Description</label>
    <input class="desc-input" id="meta-description" type="text" placeholder="What does this session demonstrate?" oninput="scheduleMetaSave()">
    <label>Tags</label>
    <input class="tags-input" id="meta-tags" type="text" placeholder="tag1, tag2..." oninput="scheduleMetaSave()">
    <button class="save-meta" onclick="saveMetadata()">Save</button>
    <span class="meta-saved" id="meta-saved">Saved!</span>
  </div>

  <div class="main">
    <div class="left-panel">
      <div class="tab-switcher" id="tab-switcher"></div>
      <div class="video-container" id="video-container">
        <div class="no-video" id="no-video"><p>No video recorded</p></div>
        <video id="video" controls style="display:none"></video>
      </div>
    </div>

    <div class="right-panel">
      <div class="timeline-header">
        <span>Timeline</span>
        <div class="timeline-filter">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
          <button class="filter-btn" data-filter="page" onclick="setFilter('page',this)">Pages</button>
          <button class="filter-btn" data-filter="network" onclick="setFilter('network',this)">Network</button>
          <button class="filter-btn" data-filter="actions" onclick="setFilter('actions',this)">Actions</button>
          <button class="filter-btn" data-filter="annotations" onclick="setFilter('annotations',this)" title="User-drawn annotations (pencil/rect/lasso)">✏️ Annot.</button>
          <button class="filter-btn mouse-btn" data-filter="mouse" onclick="setFilter('mouse',this)" title="Mouse movements (hidden by default)">Mouse</button>
          <button class="filter-btn" data-filter="dom" onclick="setFilter('dom',this)" title="DOM mutations">DOM</button>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="rich-annot-panel" id="rich-annot-panel" style="display:none">
        <h3>
          <span id="rich-annot-tool-icon">✏️</span>
          <span id="rich-annot-title">Annotation</span>
          <button class="close-x" onclick="closeRichAnnotPanel()" title="Close">×</button>
        </h3>
        <div class="meta" id="rich-annot-meta"></div>
        <img class="shot" id="rich-annot-shot" alt="annotation screenshot">
        <div class="note" id="rich-annot-note"></div>
        <div class="targets" id="rich-annot-targets"></div>
      </div>
      <div class="annotation-panel" id="annotation-panel" style="display:none">
        <label>Annotation for selected event</label>
        <textarea id="annotation-text" placeholder="Add a note about this event..."></textarea>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <button class="save-annotation-btn" onclick="saveAnnotation()">Save</button>
          <span class="save-ok" id="save-ok">Saved!</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const recordingId = location.pathname.split('/').pop();
    let recording = null;
    let rrwebEvents = [];
    let networkEntries = [];
    let interactions = [];
    let richAnnotations = [];  // [{id,timestamp,tool,shape,bbox,note,domTargets,screenshotPng,pageUrl,...}]
    let allTimelineItems = [];
    let selectedEventIndex = null;
    let annotations = {};
    let currentFilter = 'all';
    let currentVideoTabId = null;  // which tab's video is showing

    // ── Bootstrap ─────────────────────────────────────────────────────────────

    async function init() {
      try {
        // Load recording metadata
        const metaResp = await fetch(`/api/v1/recordings/${recordingId}`);
        const metaData = await metaResp.json();
        recording = metaData.recording;
        if (!recording) { document.getElementById('title-editable').textContent = 'Recording not found'; return; }

        document.title = recording.title || 'Session Review';
        document.getElementById('title-editable').textContent = recording.title || '';
        const dur = Math.round((recording.duration || 0) / 1000);
        const m = Math.floor(dur / 60), s = dur % 60;
        const counts = [
          recording.pages?.length ? `${recording.pages.length} pages` : null,
          recording.networkEntryCount ? `${recording.networkEntryCount} requests` : null,
          recording.interactionCount ? `${recording.interactionCount} actions` : null,
        ].filter(Boolean).join(' · ');
        document.getElementById('recording-meta').textContent =
          `${new Date(recording.startTime).toLocaleString()} · ${m}:${s.toString().padStart(2,'0')}${counts ? ' · ' + counts : ''}`;

        // Restore annotations
        if (recording.annotations) {
          recording.annotations.forEach(a => { annotations[a.eventTimestamp] = a.text; });
        }

        // Populate meta bar fields (description, tags)
        populateMetaBar();

        // Load events (rrweb + network + interactions)
        const eventsResp = await fetch(`/api/v1/recordings/${recordingId}/events`);
        const eventsData = await eventsResp.json();
        rrwebEvents = eventsData.rrwebEvents || [];
        networkEntries = eventsData.networkEntries || [];
        interactions = eventsData.interactions || [];

        // Load rich annotations (pencil/rect/lasso drawings + screenshots + notes
        // captured by the user during the recording). Empty-array OK if none.
        try {
          const annotResp = await fetch(`/api/v1/recordings/${recordingId}/annotations`);
          const annotData = await annotResp.json();
          richAnnotations = annotData.annotations || [];
        } catch (e) {
          console.warn('Failed to load rich annotations:', e);
          richAnnotations = [];
        }

        // Set up video
        setupVideo();

        // Build timeline
        buildTimeline();
        // Wire up inline title editing
        setupTitleEditor();

        // Auto-open details bar if no real title yet
        if (!recording.title || recording.title.startsWith('Session:')) {
          document.getElementById('title-editable').focus();
        }
      } catch (err) {
        console.error('Failed to load recording:', err);
        document.getElementById('title-editable').textContent = 'Error loading recording: ' + err.message;
      }
    }

    // ── Video ─────────────────────────────────────────────────────────────────

    function setupVideo() {
      const recordedTabIds = recording.recordedTabIds || [];
      const video = document.getElementById('video');
      video.addEventListener('timeupdate', onVideoTimeUpdate);

      if (recordedTabIds.length > 1) {
        // Build tab switcher
        const switcher = document.getElementById('tab-switcher');
        switcher.style.display = 'flex';
        recordedTabIds.forEach((tabId, i) => {
          const firstPage = (recording.pages || []).find(p => p.tabId === tabId);
          let label = `Tab ${i + 1}`;
          if (firstPage?.url) { try { label = new URL(firstPage.url).hostname; } catch {} }
          const btn = document.createElement('button');
          btn.className = 'tab-video-btn';
          btn.dataset.tabId = String(tabId);
          btn.textContent = label;
          btn.title = firstPage?.url || '';
          btn.onclick = () => switchToTabVideo(tabId);
          switcher.appendChild(btn);
        });
        // Load primary tab first
        switchToTabVideo(recording.primaryTabId || recordedTabIds[0]);
      } else if (recordedTabIds.length === 1) {
        switchToTabVideo(recordedTabIds[0]);
      } else {
        // Legacy recording — try old single-video path
        fetch(`/api/v1/recordings/${recordingId}/video`, { method: 'HEAD' })
          .then(r => {
            if (r.ok) {
              video.src = `/api/v1/recordings/${recordingId}/video`;
              video.style.display = 'block';
              document.getElementById('no-video').style.display = 'none';
            }
          }).catch(() => {});
      }
    }

    function switchToTabVideo(tabId) {
      currentVideoTabId = tabId;
      const video = document.getElementById('video');
      const noVideo = document.getElementById('no-video');

      // Update switcher active state
      document.querySelectorAll('.tab-video-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tabId == String(tabId));
      });

      const url = `/api/v1/recordings/${recordingId}/video/${tabId}`;
      fetch(url, { method: 'HEAD' }).then(r => {
        if (r.ok) {
          const wasPlaying = !video.paused;
          const prevTime = video.currentTime;
          video.src = url;
          video.style.display = 'block';
          noVideo.style.display = 'none';
          // Restore playback state if switching while playing
          video.addEventListener('loadedmetadata', () => {
            if (wasPlaying) video.play().catch(() => {});
          }, { once: true });
        } else {
          video.style.display = 'none';
          noVideo.style.display = 'flex';
          noVideo.querySelector('p').textContent = 'No video for this tab';
        }
      }).catch(() => {
        video.style.display = 'none';
        noVideo.style.display = 'flex';
      });
    }

    function onVideoTimeUpdate() {
      const video = document.getElementById('video');
      if (!recording) return;
      const videoStartTimes = recording.videoStartTimes || {};
      const startTime = (currentVideoTabId && videoStartTimes[currentVideoTabId])
        ? videoStartTimes[currentVideoTabId]
        : (recording.videoStartTime || recording.startTime);
      const absMs = startTime + video.currentTime * 1000;

      // Highlight the closest timeline item for current tab (or all if no tab context)
      let bestIdx = -1, bestDiff = Infinity;
      allTimelineItems.forEach((item, i) => {
        if (currentVideoTabId && item.tabId && item.tabId !== currentVideoTabId) return;
        const diff = Math.abs(item.absTimestamp - absMs);
        if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
      });

      document.querySelectorAll('.timeline-event').forEach(el => el.classList.remove('active'));
      if (bestIdx >= 0 && bestDiff < 5000) {
        const el = document.getElementById(`te-${bestIdx}`);
        if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
      }
    }

    function seekVideo(absTimestamp, eventTabId) {
      const video = document.getElementById('video');
      if (!recording) return;
      const videoStartTimes = recording.videoStartTimes || {};
      const recordedTabIds = recording.recordedTabIds || [];

      // Auto-switch to the event's tab video if needed
      const targetTab = eventTabId && recordedTabIds.includes(eventTabId) ? eventTabId : currentVideoTabId;
      if (targetTab && targetTab !== currentVideoTabId) {
        switchToTabVideo(targetTab);
        // Seek after video loads
        video.addEventListener('loadedmetadata', () => {
          const st = videoStartTimes[targetTab] || recording.videoStartTime || recording.startTime;
          const offsetSec = (absTimestamp - st) / 1000;
          if (offsetSec >= 0) video.currentTime = offsetSec;
        }, { once: true });
        return;
      }

      const st = (targetTab && videoStartTimes[targetTab])
        ? videoStartTimes[targetTab]
        : (recording.videoStartTime || recording.startTime);
      const offsetSec = (absTimestamp - st) / 1000;
      if (video.src && offsetSec >= 0) video.currentTime = offsetSec;
    }


    // ── Timeline ──────────────────────────────────────────────────────────────

    const KIND_META = {
      click:        { icon: '⬤', label: 'click',    cls: 'kind-click'     },
      contextmenu:  { icon: '⊞', label: 'rclick',   cls: 'kind-click'     },
      middle_click: { icon: '⊕', label: 'mclick',   cls: 'kind-click'     },
      auxclick:     { icon: '⊕', label: 'auxclick',  cls: 'kind-click'     },
      input_change: { icon: '✎', label: 'type',     cls: 'kind-input'     },
      select_change:{ icon: '▾', label: 'select',   cls: 'kind-input'     },
      selection:    { icon: '▐', label: 'sel',      cls: 'kind-selection' },
      copy:         { icon: '⎘', label: 'copy',     cls: 'kind-copy'      },
      cut:          { icon: '✂', label: 'cut',      cls: 'kind-copy'      },
      paste:        { icon: '⎗', label: 'paste',    cls: 'kind-copy'      },
      keypress:     { icon: '⌨', label: 'key',      cls: 'kind-keypress'  },
      form_submit:  { icon: '▶', label: 'submit',   cls: 'kind-form'      },
      scroll:       { icon: '↕', label: 'scroll',   cls: 'kind-mouse'     },
      mousemove:    { icon: '·', label: 'move',     cls: 'kind-mouse'     },
      hover:        { icon: '◐', label: 'hover',    cls: 'kind-selection' },
      rrweb_click:      { icon: '⬤', label: 'click',    cls: 'kind-click'     },
      dom_mutation:     { icon: '◈', label: 'dom',      cls: 'kind-dom'       },
      spa_navigate:     { icon: '⇒', label: 'navigate', cls: 'kind-nav'       },
      visibility_change:{ icon: '👁', label: 'visible',  cls: 'kind-nav'       },
      js_error:         { icon: '✖', label: 'error',    cls: 'kind-error'     },
      focus:            { icon: '◎', label: 'focus',    cls: 'kind-input'     },
      media_play:       { icon: '▶', label: 'play',     cls: 'kind-media'     },
      media_pause:      { icon: '⏸', label: 'pause',    cls: 'kind-media'     },
      media_ended:      { icon: '⏹', label: 'ended',    cls: 'kind-media'     },
      media_seeked:     { icon: '⏩', label: 'seek',     cls: 'kind-media'     },
      drag_start:       { icon: '↗', label: 'drag',     cls: 'kind-click'     },
      drop:             { icon: '↙', label: 'drop',     cls: 'kind-click'     },
      dialog:           { icon: '⬜', label: 'dialog',   cls: 'kind-nav'       },
    };

    function buildTimeline() {
      allTimelineItems = [];
      const startTime = recording.startTime;

      // Rich annotations (pencil/rect/lasso) — each becomes a timeline item
      // with the annotation's own offset so it sits in chronological order.
      // We index them with `annotIndex` so the click handler can look up the
      // full record from richAnnotations[].
      richAnnotations.forEach((a, idx) => {
        allTimelineItems.push({
          type: 'rich-annotation',
          tabId: a.tabId || null,
          absTimestamp: a.timestamp,
          offsetMs: (a.timestamp || startTime) - startTime,
          annotIndex: idx,
          tool: a.tool,
          shortLabel: a.note || `(${a.tool} annotation)`,
        });
      });

      // Page starts
      (recording.pages || []).forEach(page => {
        let host = page.url;
        try { host = new URL(page.url).pathname || '/'; } catch {}
        allTimelineItems.push({
          type: 'page',
          tabId: page.tabId || null,
          absTimestamp: page.startTime,
          offsetMs: page.startTime - startTime,
          label: page.url,
          shortLabel: host,
          title: page.title,
          url: page.url,
        });
      });

      // Network entries
      networkEntries.forEach(entry => {
        const ts = entry.timestamp || startTime;
        let shortUrl = entry.url || '';
        try { const u = new URL(entry.url); shortUrl = u.pathname + (u.search.length > 1 ? u.search.slice(0,40) : ''); } catch {}
        allTimelineItems.push({
          type: 'network',
          absTimestamp: ts,
          offsetMs: ts - startTime,
          method: entry.method,
          url: entry.url,
          shortUrl,
          status: entry.responseStatus,
          duration: entry.duration,
          requestBody: entry.requestBody,
          requestHeaders: entry.requestHeaders,
          responseBody: entry.responseBody,
          responseHeaders: entry.responseHeaders,
        });
      });

      // rrweb mouse click events — used as fallback when no SR_INTERACTION data exists,
      // OR always shown to catch clicks on pages where content script failed to inject.
      // De-duplicate: skip rrweb clicks that have a matching SR_INTERACTION within 300ms.
      const interactionTimestamps = new Set(interactions.map(a => a.timestamp));
      rrwebEvents.forEach(ev => {
        if (ev.type !== 3 || !ev.data) return;
        // source=2 MouseInteraction, type=2 Click (not MouseUp/MouseDown)
        if (ev.data.source !== 2 || ev.data.type !== 2) return;
        // Skip if covered by an SR_INTERACTION within 300ms
        const hasCoverage = [...interactionTimestamps].some(t => Math.abs(t - ev.timestamp) < 300);
        if (hasCoverage) return;
        allTimelineItems.push({
          type: 'interaction',
          kind: 'rrweb_click',
          meta: { icon: '⬤', label: 'click', cls: 'kind-click' },
          absTimestamp: ev.timestamp,
          offsetMs: ev.timestamp - startTime,
          label: `click at (${ev.data.x ?? '?'}, ${ev.data.y ?? '?'})`,
          action: { kind: 'rrweb_click', timestamp: ev.timestamp, x: ev.data.x, y: ev.data.y },
        });
      });

      // Interaction events
      interactions.forEach(action => {
        const meta = KIND_META[action.kind] || { icon: '·', label: action.kind, cls: '' };
        let label = '';
        if (action.kind === 'mousemove') {
          label = `(${action.x}, ${action.y})`;
        } else if (action.kind === 'scroll') {
          label = `(${action.scrollX}, ${action.scrollY})`;
        } else if (action.kind === 'click' || action.kind === 'contextmenu' || action.kind === 'middle_click' || action.kind === 'auxclick') {
          label = `${action.selector || action.tagName || 'element'}`;
          if (action.text) label += `  "${action.text.slice(0, 60)}"`;
        } else if (action.kind === 'hover') {
          const ctxText = action.context?.container?.text || action.context?.target?.text || action.text || '';
          const sel = action.context?.target?.selector || action.selector || action.tagName || 'element';
          label = `${sel}${ctxText ? `  "${ctxText.slice(0, 80)}"` : ''}`;
        } else if (action.kind === 'input_change') {
          const target = action.id ? `#${action.id}` : (action.name ? `[name=${action.name}]` : action.selector || 'input');
          label = `${target}: "${action.value?.slice(0, 60)}"`;
        } else if (action.kind === 'select_change') {
          label = `${action.id || action.name || action.selector || 'select'}: "${action.selectedText?.slice(0, 60)}"`;
        } else if (action.kind === 'selection') {
          label = `"${action.text?.slice(0, 80)}"`;
        } else if (action.kind === 'copy' || action.kind === 'cut' || action.kind === 'paste') {
          label = `"${action.text?.slice(0, 80)}"`;
        } else if (action.kind === 'keypress') {
          label = `${action.key}${action.ctrlKey ? ' (Ctrl)' : ''}${action.metaKey ? ' (⌘)' : ''} in ${action.selector || action.tagName || '?'}`;
        } else if (action.kind === 'form_submit') {
          label = `${action.action || action.selector || 'form'}`;
        } else if (action.kind === 'dom_mutation') {
          const n = action.count || (action.mutations || []).length;
          const types = [...new Set((action.mutations || []).map(m => m.type))].join(', ');
          const hasExtInj = (action.mutations || []).some(m => m.type === 'ext_injection');
          label = `${n} change${n !== 1 ? 's' : ''} (${types || 'unknown'})${hasExtInj ? ' ⚠ ext' : ''}`;
        } else if (action.kind === 'spa_navigate') {
          let short = action.url || '';
          try { short = new URL(action.url).pathname + (new URL(action.url).search || ''); } catch {}
          label = `${action.navigationType} → ${short}`;
        } else if (action.kind === 'visibility_change') {
          label = action.visible ? 'tab visible' : 'tab hidden';
        } else if (action.kind === 'js_error') {
          label = action.message?.slice(0, 100) || 'error';
        } else if (action.kind === 'focus') {
          const target = action.id ? `#${action.id}` : (action.name ? `[name=${action.name}]` : action.selector || action.tagName || 'element');
          label = target;
        } else if (action.kind?.startsWith('media_')) {
          const t = action.currentTime != null ? ` @${action.currentTime}s` : '';
          label = `${action.tag || 'media'}${t}`;
        } else if (action.kind === 'drag_start' || action.kind === 'drop') {
          label = action.text ? `"${action.text.slice(0, 60)}"` : (action.selector || 'element');
        } else if (action.kind === 'dialog') {
          label = `${action.dialogType}: "${action.message?.slice(0, 80)}"`;
        }
        allTimelineItems.push({
          type: 'interaction',
          kind: action.kind,
          tabId: action.tabId || null,
          meta,
          absTimestamp: action.timestamp,
          offsetMs: action.timestamp - startTime,
          label,
          action,
        });
      });

      // Sort by time
      allTimelineItems.sort((a, b) => a.absTimestamp - b.absTimestamp);

      renderTimeline();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTimeline();
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';
      let count = 0;

      allTimelineItems.forEach((item, i) => {
        // Mouse/scroll events hidden unless explicitly selected
        const isMouseKind = item.kind === 'mousemove' || item.kind === 'scroll';
        const isDomMutation = item.kind === 'dom_mutation';
        if (isMouseKind && currentFilter !== 'mouse') return;
        if (isDomMutation && currentFilter !== 'dom' && currentFilter !== 'all') return;
        if (currentFilter === 'page' && item.type !== 'page') return;
        if (currentFilter === 'network' && item.type !== 'network') return;
        if (currentFilter === 'actions' && (item.type !== 'interaction' || isMouseKind || isDomMutation)) return;
        if (currentFilter === 'mouse' && !isMouseKind) return;
        if (currentFilter === 'dom' && !isDomMutation) return;
        if (currentFilter === 'annotations' && item.type !== 'rich-annotation') return;
        count++;

        const ms = Math.max(0, item.offsetMs);
        const t = Math.round(ms / 1000);
        const m = Math.floor(t / 60), s = t % 60;
        const timeStr = `${m}:${s.toString().padStart(2,'0')}`;

        const div = document.createElement('div');
        let cls = 'timeline-event';
        if (item.type === 'page') cls += ' page-start';
        if (item.type === 'network') cls += ' ev-network';
        if (item.type === 'interaction') cls += (item.kind === 'mousemove' || item.kind === 'scroll') ? ' ev-mouse' : item.kind === 'dom_mutation' ? ' ev-dom' : ' ev-interaction';
        if (item.type === 'rich-annotation') cls += ' ev-rich-annotation';
        if (selectedEventIndex === i) cls += ' selected';
        div.className = cls;
        div.id = `te-${i}`;

        let icon, iconCls = '', label = '', badgeHtml = '', detailHtml = '';

        if (item.type === 'rich-annotation') {
          icon = item.tool === 'rect' ? '▭' : item.tool === 'lasso' ? '🪢' : '✏️';
          iconCls = 'kind-rich-annot';
          label = item.shortLabel || `(${item.tool})`;
          badgeHtml = `<span class="event-badge badge-kind" style="background:#fee2e2;color:#b91c1c">${item.tool}</span>`;
        } else if (item.type === 'page') {
          icon = '◉';
          iconCls = 'kind-page';
          label = item.url;
          if (item.title) label = `${item.title} — ${item.shortLabel}`;
        } else if (item.type === 'network') {
          icon = '○';
          iconCls = 'kind-network';
          label = `${item.method} ${item.shortUrl || item.url}`;
          const ok = item.status >= 200 && item.status < 400;
          badgeHtml = `<span class="event-badge ${ok ? 'badge-ok' : 'badge-err'}">${item.status}</span>`;
          if (item.duration) badgeHtml += ` <span style="font-size:10px;color:#999">${item.duration}ms</span>`;

          // Build expandable detail
          let detail = '';
          if (item.requestHeaders && Object.keys(item.requestHeaders).length) {
            detail += `<div class="detail-field"><span class="detail-key">REQUEST HEADERS</span>\n${JSON.stringify(item.requestHeaders, null, 2)}</div>`;
          }
          if (item.requestBody) {
            detail += `<div class="detail-field"><span class="detail-key">REQUEST BODY</span>\n${escHtml(truncate(item.requestBody, 600))}</div>`;
          }
          if (item.responseHeaders && Object.keys(item.responseHeaders).length) {
            detail += `<div class="detail-field"><span class="detail-key">RESPONSE HEADERS</span>\n${JSON.stringify(item.responseHeaders, null, 2)}</div>`;
          }
          if (item.responseBody) {
            detail += `<div class="detail-field"><span class="detail-key">RESPONSE BODY</span>\n${escHtml(truncate(item.responseBody, 1000))}</div>`;
          }
          detailHtml = `<div class="event-detail" id="detail-${i}">${detail || '(no body)'}</div>`;
        } else if (item.type === 'interaction') {
          icon = item.meta.icon;
          iconCls = item.meta.cls;
          label = item.label;
          badgeHtml = `<span class="event-badge badge-kind">${item.meta.label}</span>`;

          // Build interaction detail
          const a = item.action;
          let detail = '';
          if (a.selector) detail += `<div class="detail-field"><span class="detail-key">selector: </span><span class="detail-val">${escHtml(a.selector)}</span></div>`;
          if (a.tagName) detail += `<div class="detail-field"><span class="detail-key">element: </span><span class="detail-val">${escHtml(a.tagName)}${a.id ? '#'+a.id : ''}</span></div>`;
          if (a.x !== undefined) detail += `<div class="detail-field"><span class="detail-key">position: </span><span class="detail-val">(${a.x}, ${a.y}) client · (${a.pageX}, ${a.pageY}) page</span></div>`;
          if (a.text && a.kind === 'click') detail += `<div class="detail-field"><span class="detail-key">text: </span><span class="detail-val">${escHtml(a.text)}</span></div>`;
          if (a.value !== undefined) detail += `<div class="detail-field"><span class="detail-key">value: </span><span class="detail-val">${escHtml(a.value)}</span></div>`;
          if (a.placeholder) detail += `<div class="detail-field"><span class="detail-key">placeholder: </span><span class="detail-val">${escHtml(a.placeholder)}</span></div>`;
          if (a.text && a.kind !== 'click') detail += `<div class="detail-field"><span class="detail-key">text: </span><span class="detail-val">${escHtml(a.text.slice(0, 800))}</span></div>`;
          if (a.key) detail += `<div class="detail-field"><span class="detail-key">key: </span><span class="detail-val">${escHtml(a.key)}</span></div>`;
          if (a.action && a.kind === 'form_submit') detail += `<div class="detail-field"><span class="detail-key">action: </span><span class="detail-val">${escHtml(a.action)}</span></div>`;
          if (a.method && a.kind === 'form_submit') detail += `<div class="detail-field"><span class="detail-key">method: </span><span class="detail-val">${escHtml(a.method)}</span></div>`;
          detailHtml = `<div class="event-detail" id="detail-${i}">${detail || escHtml(JSON.stringify(a, null, 2))}</div>`;
        }

        const annotationHtml = annotations[item.absTimestamp]
          ? `<div style="font-size:11px;color:#6f42c1;margin-top:3px;padding-left:22px">📝 ${escHtml(annotations[item.absTimestamp])}</div>`
          : '';

        div.innerHTML = `
          <div class="event-row">
            <span class="event-icon ${iconCls}">${icon}</span>
            <span class="event-time">${timeStr}</span>
            <span class="event-label" title="${escHtml(label)}">${escHtml(label.length > 70 ? label.slice(0,70)+'…' : label)}</span>
            ${badgeHtml}
          </div>
          ${detailHtml}
          ${annotationHtml}
        `;

        div.addEventListener('click', () => selectEvent(i, item));
        container.appendChild(div);
      });

      if (count === 0) {
        container.innerHTML = '<div style="padding:20px;color:#999;text-align:center">No events to display</div>';
      }
    }

    function selectEvent(i, item) {
      document.querySelectorAll('.timeline-event').forEach(el => el.classList.remove('selected'));
      const el = document.getElementById(`te-${i}`);
      if (el) el.classList.add('selected');

      selectedEventIndex = i;

      // Toggle expandable detail
      const detail = document.getElementById(`detail-${i}`);
      if (detail) detail.classList.toggle('visible');

      seekVideo(item.absTimestamp, item.tabId);

      // Rich annotation? Show the dedicated drawing+screenshot+DOM panel.
      if (item.type === 'rich-annotation') {
        showRichAnnotPanel(richAnnotations[item.annotIndex]);
        document.getElementById('annotation-panel').style.display = 'none';
        return;
      }
      document.getElementById('rich-annot-panel').style.display = 'none';

      // Show per-event text-annotation panel (legacy text notes)
      document.getElementById('annotation-panel').style.display = 'block';
      const ta = document.getElementById('annotation-text');
      ta.value = annotations[item.absTimestamp] || '';
      ta.dataset.timestamp = item.absTimestamp;
    }

    function showRichAnnotPanel(a) {
      if (!a) return;
      const panel = document.getElementById('rich-annot-panel');
      panel.style.display = 'block';
      document.getElementById('rich-annot-tool-icon').textContent =
        a.tool === 'rect' ? '▭' : a.tool === 'lasso' ? '🪢' : '✏️';
      document.getElementById('rich-annot-title').textContent = `Annotation — ${a.tool}`;
      // Meta line: timestamp + pageUrl + bbox
      const ts = new Date(a.timestamp).toLocaleString();
      const b = a.bbox || {};
      const metaParts = [
        ts,
        a.pageUrl ? `<a href="${escAttr(a.pageUrl)}" target="_blank" style="color:inherit">${escHtml(truncate(a.pageUrl, 60))}</a>` : null,
        b.w ? `bbox ${Math.round(b.w)}×${Math.round(b.h)} @ (${Math.round(b.x)},${Math.round(b.y)})` : null,
      ].filter(Boolean).join(' · ');
      document.getElementById('rich-annot-meta').innerHTML = metaParts;
      const shot = document.getElementById('rich-annot-shot');
      if (a.screenshotPng) {
        shot.src = a.screenshotPng;
        shot.style.display = 'block';
      } else {
        shot.removeAttribute('src');
        shot.style.display = 'none';
      }
      const noteEl = document.getElementById('rich-annot-note');
      if (a.note && a.note.trim()) {
        noteEl.textContent = a.note;
        noteEl.style.display = 'block';
      } else {
        noteEl.textContent = '(no note)';
        noteEl.style.color = '#999';
        noteEl.style.fontStyle = 'italic';
      }
      // DOM targets list
      const tEl = document.getElementById('rich-annot-targets');
      if (a.domTargets && a.domTargets.length) {
        const lis = a.domTargets.map((t, i) => {
          const tagSpan = `<span class="tag">&lt;${escHtml(t.tag || '?')}&gt;</span>`;
          const sel = t.css || t.xpath || '';
          const text = (t.text || '').slice(0, 80);
          return `<li>${tagSpan}<span class="selectors">${escHtml(sel)}</span>${text ? `<div class="preview-text">${escHtml(text)}${(t.text || '').length > 80 ? '…' : ''}</div>` : ''}</li>`;
        }).join('');
        tEl.innerHTML = `<h4>DOM targets (${a.domTargets.length}, ranked by overlap)</h4><ol>${lis}</ol>`;
      } else {
        tEl.innerHTML = `<h4>DOM targets</h4><div style="font-size:11px;color:#999;font-style:italic">(none)</div>`;
      }
    }

    function closeRichAnnotPanel() {
      document.getElementById('rich-annot-panel').style.display = 'none';
    }

    function escAttr(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function saveAnnotation() {
      const ta = document.getElementById('annotation-text');
      const ts = parseInt(ta.dataset.timestamp);
      if (!ts) return;
      annotations[ts] = ta.value;

      const annotationsArr = Object.entries(annotations).map(([k, v]) => ({
        id: String(k),
        eventTimestamp: parseInt(k),
        text: v,
      }));

      try {
        await fetch(`/api/v1/recordings/${recordingId}/annotations`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ annotations: annotationsArr }),
        });
        const ok = document.getElementById('save-ok');
        ok.style.display = 'inline';
        setTimeout(() => { ok.style.display = 'none'; }, 2000);
        renderTimeline(); // Re-render to show annotation
      } catch(e) {
        alert('Failed to save annotation: ' + e.message);
      }
    }

    function toggleMetaBar() {
      document.getElementById('meta-bar').classList.toggle('open');
    }

    // Populate meta bar fields from recording object (called once on init)
    function populateMetaBar() {
      if (!recording) return;
      document.getElementById('meta-description').value = recording.description || '';
      document.getElementById('meta-tags').value = (recording.tags || []).join(', ');
    }

    // ── Inline title editor ───────────────────────────────────────────────────
    function setupTitleEditor() {
      const el = document.getElementById('title-editable');
      if (!el) return;

      let titleSaveTimer = null;

      const saveTitle = async () => {
        if (titleSaveTimer) { clearTimeout(titleSaveTimer); titleSaveTimer = null; }
        const newTitle = el.textContent.trim();
        if (newTitle === (recording.title || '')) return; // no change
        try {
          const r = await fetch(`/api/v1/recordings/${recordingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle }),
          });
          if (!r.ok) throw new Error(await r.text());
          if (recording) recording.title = newTitle;
          document.title = newTitle || 'Session Review';
          // Flash "Saved" indicator in header
          const saved = document.getElementById('title-saved');
          saved.classList.add('show');
          setTimeout(() => saved.classList.remove('show'), 1500);
        } catch(e) {
          console.error('Title save failed:', e.message);
        }
      };

      el.addEventListener('input', () => {
        if (titleSaveTimer) clearTimeout(titleSaveTimer);
        titleSaveTimer = setTimeout(saveTitle, 800);
      });

      el.addEventListener('blur', saveTitle);

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') {
          el.textContent = recording.title || '';
          el.blur();
        }
      });
    }

    // ── Description / Tags autosave ───────────────────────────────────────────
    let _saveTimer = null;
    function scheduleMetaSave() {
      if (_saveTimer) clearTimeout(_saveTimer);
      _saveTimer = setTimeout(saveMetadata, 800);
    }

    async function saveMetadata() {
      if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
      const description = document.getElementById('meta-description').value.trim();
      const tagsRaw = document.getElementById('meta-tags').value.trim();
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      // Include current title so we don't overwrite it
      const title = (recording && recording.title) || document.getElementById('title-editable').textContent.trim() || undefined;

      try {
        const r = await fetch(`/api/v1/recordings/${recordingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description: description || undefined, tags }),
        });
        if (!r.ok) throw new Error(await r.text());

        if (recording) {
          recording.description = description;
          recording.tags = tags;
        }

        const ok = document.getElementById('meta-saved');
        ok.style.display = 'inline';
        setTimeout(() => { ok.style.display = 'none'; }, 1500);
      } catch(e) {
        console.error('Autosave failed:', e.message);
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function truncate(s, n) {
      if (!s) return '';
      s = String(s);
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    init();
  </script>
</body>
