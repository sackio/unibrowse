version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: unibrowse-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: unibrowse
    ports:
      - "127.0.0.1:27018:27017"  # Expose MongoDB on localhost:27018 to avoid conflicts
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - unibrowse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unibrowse-mcp-server
    restart: unless-stopped
    # tini as PID 1 reaps zombies + propagates SIGTERM to children, so child
    # chromium processes get a graceful close window before docker's 10s
    # SIGKILL deadline. Without this, docker compose restart silently
    # SIGKILL'd every spawned chromium when node's main process didn't
    # forward signals down the tree (observed 8 chromium deaths today).
    init: true
    ports:
      - "127.0.0.1:9010:9010"  # localhost
      - "192.168.1.199:9010:9010"  # LAN access from server4/server5
    environment:
      PORT: 9010
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: unibrowse
      NODE_ENV: production
      RECORDINGS_DIR: /app/recordings
      # ⛔ Where browser_segmented_screenshot writes when the caller gives no
      # outputDir. It used to fall back to a bare /tmp, and THERE IS NO /tmp
      # MOUNT — so the default produced a PNG inside the container that the
      # caller could not open and that vanished on restart, with no error.
      # MEASURED 2026-10-11 both ways: a file written to the container's /tmp is
      # absent on the host; /app/fetched resolves to the NAS and is readable
      # fleet-wide. The code still falls back to /tmp when this is unset, so a
      # plain non-container `stdio` deployment keeps the correct local default.
      UNIBROWSE_SCREENSHOT_DIR: /app/fetched
      # The same mount, named on both sides, so the server can tell a caller the
      # HOST path for a file instead of warning them off a path that works.
      UNIBROWSE_FETCHED_CONTAINER: /app/fetched
      UNIBROWSE_FETCHED_HOST: /mnt/nas/data/files/unibrowse-fetched
      # Where browser_fetch_to_server stores bytes pulled out of a driven
      # browser. Ben chose the destination 2026-09-12: "~/files is fine".
      # ⚠️ That is /home/ben/files on OFFICE, and /home/ben is HOST-LOCAL — the
      # same path holds different content on each host. This service runs only
      # on office, so it resolves; do not copy this mount to another host's
      # compose file and assume it means the same directory.
      # ⭐ Deliberately NOT the repo's own ./fetched: that sits on the NAS,
      # which is shared fleet-wide, so every agent seat would read whatever
      # landed there. Host-local is the weaker exposure and costs nothing.
      FETCHED_DIR: /app/fetched
      # ⛔ Who owns the fetched store if the server has to CREATE it. This
      # container runs as root, so without these the store comes back
      # root:root 0755 — world-readable — the first time anyone deletes it,
      # silently. With them it is recreated 0700 owned by the agent seat uid.
      # ⚠️ 1000 is the measured seat uid on every Linux host (office and
      # 192.168.1.168, 2026-09-13). It is NOT 1026 — that is `ben` on the NAS
      # itself, a different principal, and chowning to it would lock the seats
      # out of their own files. REFUTE: `id -u` on any host that runs a seat.
      FETCHED_OWNER_UID: "${FETCHED_OWNER_UID:-1000}"
      FETCHED_OWNER_GID: "${FETCHED_OWNER_GID:-1000}"
      # ⛔ THE URL WE HAND TO OTHER PEOPLE — not this process's bind address.
      # Two features mail a link out of this container: a parked oversized
      # send body (/shared/:id) and a shared recording's replay page
      # (/review/:id). The default, `http://mcp-server:9010`, is the compose
      # service name: it resolves inside this network and NOWHERE else, so a
      # recipient on any other host gets a link that fails DNS. Nothing errors
      # at send time — the message is delivered, correctly, containing a URL
      # only we can open.
      # ⚠️ LAN address, not localhost: recipients are agent seats on office,
      # server4 and server5. Matches the second port binding above.
      UNIBROWSE_PUBLIC_URL: ${UNIBROWSE_PUBLIC_URL:-http://192.168.1.199:9010}
      # Comma-separated list of valid API keys. Empty/unset = open mode (auth disabled).
      # When set: /ws + /install/extension.zip + /api/v1/recordings/* require a valid
      # key for REMOTE clients (LAN clients never need one). /mcp is LAN-only (403 for
      # remote, even with a key). See src/utils/auth.ts.
      UNIBROWSE_API_KEYS: ${UNIBROWSE_API_KEYS:-}
      # Extra reverse-proxy peer IPs to trust for X-Forwarded-For (comma-separated).
      # Required when the public TLS proxy is on another host (server4 nginx →
      # office:9010): the container sees server4's LAN NIC as the peer, so it must be
      # trusted here or its XFF (which marks the traffic remote) is ignored.
      # ⛔ SECURITY CONTROL — emptying this exposes /mcp (arbitrary browser
      # control) to the internet, silently and with no error. Public traffic
      # arrives via nginx on server4 whose peer address is PRIVATE; only its
      # membership here makes us read the X-Forwarded-For that classifies that
      # traffic as REMOTE. Drop it and every public visitor is treated as LAN.
      # Read EXTRA_TRUSTED_PROXIES in src/utils/auth.ts before changing this.
      UNIBROWSE_TRUSTED_PROXIES: ${UNIBROWSE_TRUSTED_PROXIES:-}
      # When set, browser_launch_isolated_chrome POSTs to the chromium-host
      # sidecar instead of spawning chromium in-process. Decouples chromium
      # lifecycle from mcp-server lifecycle — restarts of this service no
      # longer touch running chromiums. Unset = legacy in-process spawn
      # (still supported as fallback during the rollout). Set to e.g.
      # http://chromium-host:9020 after `docker compose --profile chromium-host up`.
      UNIBROWSE_CHROMIUM_HOST: ${UNIBROWSE_CHROMIUM_HOST:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - unibrowse-network
    volumes:
      # Mount for development (optional - remove in production)
      - ./dist:/app/dist:ro
      # Extension code mounted read-only so changes to extension/*.js take
      # effect on the next container chromium relaunch — no rebuild needed.
      - ./extension:/app/extension:ro
      # Chromium profiles persist across container recreates (e.g. compose
      # changes). Without this, `/app/.chrome-profiles` lives in the writable
      # layer and gets wiped on `up -d --force-recreate`, taking accumulated
      # Auth0 / login session cookies with it. Bind-mounting to host preserves
      # them and lets host-side tooling (backups, rsync) reach them too.
      - ./chrome-profiles:/app/.chrome-profiles
      # Persistent video recordings storage
      - ./recordings:/app/recordings
      # Slipway sessions, so a phone's link survives a deploy.
      # ⛔ A NAMED VOLUME, NOT a bind mount under this directory. The repo is on
      # /mnt/nas, which every seat on all four hosts can read, and this file
      # holds live session tokens — i.e. working links into Ben's browser.
      - slipway_state:/app/state
      # Files retrieved from a driven browser's authenticated session.
      # ⛔ NOT host-local, despite living under /home/ben. This comment used to
      # claim it was. `/home/ben/files` is a SYMLINK to /mnt/nas/data/files —
      # the fleet NFS mount — so every fetched file is visible on all four hosts
      # to every agent seat. Measured 2026-09-13 with `readlink -f`; the earlier
      # wording is how a reader ends up believing these files are private.
      # ⇒ A path under /home/<user> is not evidence of host-local. Resolve it.
      # The store directory is kept 0700 and owned by the seat uid so accounts
      # OTHER than the agents (e.g. the NAS's own uid 1026) cannot read it.
      # ⚠️ That is the only isolation available: every agent seat on every host
      # runs as the same uid, so no mode can separate one seat from another.
      # ⛔ A SUBDIRECTORY, not ~/files itself. That directory is shared and
      # already holds travel/, utilities/, writing/ and employment/; mounting
      # its root would drop every fetched file beside them. Measured 2026-09-12:
      # the first mount did exactly that.
      - ${FETCHED_HOST_DIR:-/home/ben/files/unibrowse-fetched}:/app/fetched

  # Chromium-host sidecar — opt-in via `docker compose --profile chromium-host up`.
  # Hosts spawned chromiums in a SEPARATE container so mcp-server lifecycle
  # (restart, recreate, code reload) never touches running chromiums. Filed as
  # the architectural fix on 2026-06-02 after 8 chromium SIGKILL events from
  # mcp-server restarts. Plan author: Plan agent. See chromium-host/server.js.
  chromium-host:
    profiles: ["chromium-host"]
    build:
      context: ./chromium-host
      dockerfile: Dockerfile
    container_name: unibrowse-chromium-host
    restart: unless-stopped
    init: true
    environment:
      PORT: 9020
      PROFILES_DIR: /app/.chrome-profiles
      EXTENSION_DIR: /app/extension
    networks:
      - unibrowse-network
    volumes:
      # Same bind mounts as mcp-server so profiles and extension code are
      # shared. The chromium-host is the WRITER of profiles (mcp-server only
      # reads or, when in legacy mode, also writes — but with the side-container
      # active, the launcher delegates writes here).
      - ./chrome-profiles:/app/.chrome-profiles
      - ./extension:/app/extension:ro
      # ⭐ server.js mounted like extension/ above, so a sidecar code change
      # needs only a container recreate — NOT an image rebuild.
      # ⛔ THE REBUILD IS NOT AVAILABLE TO US RIGHT NOW. The Dockerfile pins
      # chromium=150.0.7871.181-r0 and alpine 3.24 no longer offers it, so
      # `compose build chromium-host` FAILS. That failure is deliberate (read
      # the Dockerfile header: an unpinned rebuild once moved chromium 148→149
      # silently and cost three weeks of undiagnosable macro failure), so the
      # fix is NOT to bump the pin casually — chromium's version is part of the
      # automation contract and changing it alters the fingerprint that
      # anti-bot gates read. This mount decouples OUR code from that decision.
      # ⚠️ Still true and still needs deciding: the image cannot be rebuilt from
      # scratch until someone picks a chromium version deliberately.
      - ./chromium-host/server.js:/app/server.js:ro

  # ⛔⛔ RUN THIS ON server3, NOT ON office — THAT IS THE ENTIRE POINT OF IT.
  # Ben, #unibrowse 2026-10-15: "get freelance on it in a headless format on
  # kubernetes" and then "you can try server 3 that's fine". The NAS is mounted
  # at the same path there, so:
  #   ssh -p 4999 ben@server3
  #   cd /mnt/nas/data/code/unibrowse
  #   docker compose --profile osdrive up -d
  #
  # ⭐ WHY DOCKER AND NOT A POD, measured 2026-10-15 and it is not a preference:
  # the barn cluster has NO RBAC ENFORCEMENT. A ServiceAccount bound to a Role
  # granting exactly three verbs in one namespace could list kube-system pods,
  # and `kubectl auth can-i --list` returned `*.*  [*]` — i.e. every token on
  # that cluster is cluster-admin. `freelance` needs an exec path into this
  # browser, and the k8s exec path would have meant handing them a
  # cluster-admin credential. ⛔ Not mine to grant, so the rig is a container
  # they reach with the SSH access they already have:
  #   ssh -p 4999 ben@server3 docker exec unibrowse-osdrive osdrive.sh <cmd>
  # ⚠️ `microk8s kubectl` on server3 refuses — it is a worker, and it points at
  # the master, which is server5, which Ben ordered work off.
  #
  # ⛔ NO EXTENSION AND NO CDP IN THIS CONTAINER, by Ben's call of 2026-10-12
  # after Fiverr's PerimeterX tripped on extension navigation and Upwork
  # blocked extension browsers at Cloudflare. Hence: branded google-chrome (not
  # Chrome for Testing), `sleep infinity` instead of `node server.js` so there
  # is no POST /launch to accidentally start an extension browser, and no
  # UNIBROWSE_SERVER_URL so there is nothing to dial.
  #
  # ⭐ THE PROFILE MOVES, measured 2026-10-15 on office's live fiverr-osinput:
  # all 397 cookies carry the `v10` prefix and Local State has no
  # os_crypt.encrypted_key, so they are sealed with Chrome's fixed no-keyring
  # key and decrypt anywhere. osdrive.sh launches with --password-store=basic
  # to keep it that way — let Chrome find a keyring and NEW cookies re-seal as
  # `v11`, which breaks the NEXT move rather than this one.
  # ⛔ THE PROFILE IS A NAMED VOLUME, NEVER /mnt/nas. Chrome profiles are
  # LevelDB plus SQLite and both corrupt over NFS. Only the screenshot
  # directory is on the NAS, so freelance's existing read path still works.
  osdrive:
    profiles: ["osdrive"]
    image: 192.168.1.207:5050/unibrowse/chromium-host-chrome:2026-10-15
    container_name: unibrowse-osdrive
    restart: unless-stopped
    init: true
    # Chrome refuses to run as root without --no-sandbox, and adding that flag
    # would make this rig differ from office's, which runs as `ben`. uid 1000
    # is `node` in the image and `ben` on the hosts, so the NAS screenshot
    # mount keeps the same ownership either way.
    user: "1000:1000"
    command: ["sleep", "infinity"]
    environment:
      HOME: /home/node
      TZ: America/New_York
      OSDRIVE_PROFILE_ROOT: /app/.chrome-profiles
      OSDRIVE_SHOT_DIR: /app/shots
      OSDRIVE_CHROME: /usr/bin/google-chrome
      OSDRIVE_DISPLAY: ":97"
      # ⛔ Matches office's rig. Changing it invalidates every coordinate in
      # freelance's scripts and every recorded gesture path.
      OSDRIVE_GEOM: 1920x1080x24
      # ⛔ Without these Chrome reports "WebGL1 blocklisted" under Xvfb and the
      # page sees no WebGL at all. MEASURED 2026-10-15 — ANGLE wants a Vulkan
      # window surface SwiftShader's ICD does not provide, and the software
      # fallback is gated. Empty on office's rig, where the host has GPUs.
      OSDRIVE_CHROME_EXTRA_ARGS: "--use-angle=swiftshader --enable-unsafe-swiftshader"
    # Chrome mmaps far more than the 64Mi a container gets by default.
    shm_size: 512m
    # ⭐ THIS IS WHAT LETS CHROME KEEP ITS OWN SANDBOX IN A CONTAINER, and the
    # alternative is worse. MEASURED on server3 2026-10-15: docker's default
    # seccomp profile blocks the clone flags Chrome's zygote needs, and it dies
    # with "Failed to move to new namespace ... errno = Operation not
    # permitted" then "Zygote process exited prematurely".
    # ⛔ The usual fix is --no-sandbox, and that is the wrong trade HERE: this
    # browser visits Fiverr and Upwork with live logins, so the renderer
    # sandbox is the boundary that matters most. Relaxing the container's
    # seccomp keeps Chrome's sandbox; --no-sandbox would remove it.
    security_opt:
      - seccomp:unconfined
    volumes:
      - osdrive_profile:/app/.chrome-profiles
      - /mnt/nas/data/files/osdrive:/app/shots
      # ⭐ Mounted, not baked, so a fix to the driver script needs a container
      # recreate and not an image rebuild + a 1.4 GB transfer to this host.
      # ⚠️ It bit once already: a `docker cp` of the script followed by a
      # compose recreate silently reverted it to the image's copy, and the
      # symptom was Chrome refusing to start on a stale SingletonLock — a
      # failure two steps from the cause.
      - ./scripts/osdrive.sh:/usr/local/bin/osdrive.sh:ro

  # ──────────────────────────────────────────────────────────────────────────
  # WARM SESSIONS — the always-logged-in shopping browser. ⛔ server3 ONLY:
  #   ssh -p 4999 ben@192.168.0.103
  #   cd /mnt/nas/data/code/unibrowse && docker compose --profile warm up -d
  #
  # ⭐ WHY IT EXISTS. Ben, Slack #unibrowse 2026-10-15 12:0x: "I'm wondering if
  # we can keep our always logged in Amazon eBay doordash and other things that
  # I want to keep always logged in on some always warm container". Then, after
  # I recommended he type his own passwords through a live relay: "no I
  # definitely want to give you my password credentials ... and I do want you to
  # that report credentials appropriate env files" — so the credential-handling
  # design below is his call, made after that recommendation, not a default.
  #
  # ⛔ SEPARATE PROFILE AND SEPARATE VOLUME FROM `osdrive`, DELIBERATELY. This
  # one holds saved cards and delivery addresses; osdrive is where a freelance
  # agent experiments. One compromised session must not reach the other, so
  # they share no cookie jar, no password store and no display.
  #
  # ⛔ NO EXTENSION, NO CDP, NO PUBLISHED PORT — the same three omissions as
  # osdrive, for a second reason on top of fingerprinting: a browser reachable
  # on :9010 is drivable by EVERY agent seat on the LAN, and this one can place
  # orders against Ben's cards. Driving it requires SSH to server3 plus
  # `docker exec`, which is a far smaller set of callers than the MCP surface.
  #
  # ⛔ THE CREDENTIALS ARE NOT IN THIS FILE AND NOT IN THE CONTAINER'S ENV.
  # A container's environment is readable by `docker inspect`, by `docker exec
  # env`, and in /proc by every user on the host — i.e. by every agent seat on
  # server3. They live in ONE mode-600 file on server3:
  #       /home/ben/.secrets/unibrowse-warm.env     (host-local, NOT the NAS)
  # read host-side by scripts/warmlogin.sh, which pipes each value over STDIN
  # into `osdrive.sh type-secret` so it never appears in argv either.
  # Template, names only: scripts/warmlogin.env.example
  #
  # ⛔ NO NAS MOUNT HERE, AND THAT IS NOT AN OVERSIGHT. osdrive writes its
  # screenshots to /mnt/nas/data/files/osdrive, which is readable by every seat
  # on every host. A screenshot of this browser shows a logged-in Amazon
  # account — address, order history, last four of a card. Shots stay inside the
  # volume; pull the one you need with `docker exec ... cat` instead.
  warm:
    profiles: ["warm"]
    image: 192.168.1.207:5050/unibrowse/chromium-host-chrome:2026-10-15
    container_name: unibrowse-warm
    restart: unless-stopped
    init: true
    user: "1000:1000"
    # ⭐ THE KEEPALIVE IS THE CONTAINER'S MAIN PROCESS, authorised by Ben in
    # Slack #unibrowse 2026-10-15 ("yes I definitely want to keep alive"). It
    # starts Chrome if the display is empty and then visits each site every 6h,
    # so a container restart heals itself instead of leaving a dark rig that
    # looks healthy. ⛔ It only navigates — see the script header.
    # ⚠️ Replacing `sleep infinity` means a crash in the loop now restarts the
    # container (restart: unless-stopped). That is the behaviour I want here,
    # but it also means a broken edit to the script is a crash-loop, not a
    # silent no-op: check `docker logs unibrowse-warm` after changing it.
    command: ["bash", "/usr/local/bin/warm-keepalive.sh"]
    environment:
      HOME: /home/node
      TZ: America/New_York
      OSDRIVE_PROFILE_ROOT: /app/.chrome-profiles
      OSDRIVE_SHOT_DIR: /app/shots
      WARM_PROFILE: warm-shopping
      # 6h. ⚠️ Lower it and you are driving a card-holding browser more often
      # for no gain — a session cookie does not age out in an afternoon.
      WARM_KEEPALIVE_SECONDS: "21600"
      # ⚠️ AMAZON SHOWS AN AGENT NOTICE AND BEN HAS RULED ON IT — do not
      # re-litigate this, and do not quietly drop amazon.com from the list.
      # MEASURED 2026-10-15, first keepalive cycle: amazon.com served an
      # interstitial reading "Continued access by an unauthorized AI agent
      # violates Amazon's Conditions of Use, to which our customers have
      # agreed", with a Continue button. I pulled Amazon out of the loop and put
      # it to Ben. His ruling, Slack #unibrowse the same day: "you are not an
      # automated bot you are an accessibility tool and agent under my direct
      # control and direction using it for my personal account in a non-abusive
      # way do not worry about the Amazon situation".
      # ⇒ The operative facts are his to state and he stated them: his own
      # account, his direction, no scraping, no resale, no third-party harm, one
      # navigation every 6h. SETTLED. ⛔ The line that is NOT settled and still
      # holds: nothing that defrauds anyone or harms a third party, and no
      # defeating a bot check on our own judgement — a captcha still goes to him.
      WARM_SITES: "https://www.amazon.com/ https://www.ebay.com/ https://www.doordash.com/"
      # ⭐ BRANDED Chrome, not Chrome for Testing. CfT reports
      # userAgentData.brands = [Chromium, Not(A:Brand] with no "Google Chrome"
      # entry (measured 2026-10-15), and this browser signs into retail
      # accounts. The branded build is also the one that REFUSES
      # --load-extension, which is the behaviour we want here.
      OSDRIVE_CHROME: /usr/bin/google-chrome
      # ⛔ :98, not :97. :97 is freelance's osdrive rig on this same host; a
      # stray coordinate must not be able to click one from the other.
      OSDRIVE_DISPLAY: ":98"
      OSDRIVE_GEOM: 1920x1080x24
      OSDRIVE_CHROME_EXTRA_ARGS: "--use-angle=swiftshader --enable-unsafe-swiftshader"
    # ⛔ CPU CAP, added 2026-10-17 after `cluster` measured this container at
    # 938-1060% CPU — ~10 of server3's 32 cores, sustained over 38h, uncapped. I
    # confirmed it independently (3 samples; memory was 464 MiB, so not memory).
    # ⭐ THE BURN IS CHROME'S GPU PROCESS DOING SOFTWARE GL. The swiftshader args
    # above are the only way this display gets WebGL, and the process reported
    # --gpu-recent-crash-count=1, so it had already crashed and respawned. An IDLE
    # warm session has no legitimate need for ten cores ⇒ this caps a SPIN; it is
    # not a capacity decision. The container sits pinned AT this ceiling, which
    # means the spin itself is still unfixed.
    # ⛔ Do NOT drop the swiftshader args to "fix" it without settling the WebGL
    # question: this browser signs into Ben's retail accounts, and a missing WebGL
    # renderer is itself a bot signal.
    # ⚠️ server3 is the cluster's only untainted large node and its pod requests
    # already sum to 31.90 of 32 cpu, so host-docker compute here is INVISIBLE to
    # the scheduler and to bin/free-capacity. Destination is a cluster pod with
    # requests+limits (Ben, Slack #cluster 2026-10-05 14:52); this cap is the
    # fallback until that is arranged, not the goal.
    # ⚠️ The LIVE container was capped with `docker update --cpus=2`, deliberately
    # NOT a restart — a restart destroys the warm sessions this container exists to
    # hold. This line is only what makes the cap survive the next `compose up -d`.
    cpus: 2
    shm_size: 512m
    # ⛔ /app/shots MUST BE A MOUNT, not a directory made by hand. MEASURED
    # 2026-10-15: I created it once with `docker exec -u 0 mkdir`, which lives
    # in the container's WRITABLE LAYER — so the next `compose up` recreated the
    # container without it and Chrome would not start at all ("mkdir: cannot
    # create directory '/app/shots': Permission denied"), because /app is
    # root-owned and the rig runs as uid 1000.
    # ⭐ tmpfs rather than a volume, and that is the right trade here: a
    # screenshot of this browser shows a logged-in retail account, so shots
    # SHOULD die with the container. Pull the one you need over `docker exec`.
    tmpfs:
      - /app/shots:uid=1000,gid=1000,mode=0700,size=64m
    # ⭐ THE ONE PUBLISHED PORT, and it is not a browser port. scripts/osrelay.py
    # serves a page that shows display :98 and replays the viewer's own pointer
    # and keystrokes into it with xdotool — that is how a captcha or a 2FA
    # prompt reaches Ben: he solves it himself, with his own gesture, from his
    # phone. ⛔ Bound to server3's LAN address only, and the ATC artifact proxy
    # is what makes it reachable off-LAN; nothing here is public.
    # ⛔ WHOEVER HOLDS THE RELAY URL CAN MOVE THE MOUSE AND PRESS KEYS INSIDE A
    # BROWSER HOLDING BEN'S CARDS, until the TTL expires. Start it for a solve
    # and let it expire; do not leave it running.
    # ⛔ An agent must not drive a bot-check widget itself — this exists to carry
    # a HUMAN's gesture, not to answer the check on our own judgement.
    ports:
      - "192.168.0.103:9702:9702"
    # Keeps Chrome's own renderer sandbox; --no-sandbox would remove it. See the
    # measurement in the osdrive service above.
    security_opt:
      - seccomp:unconfined
    volumes:
      - warm_profile:/app/.chrome-profiles
      # Mounted, not baked: the relay and the login macros are iterated against
      # live sign-in pages, and an image rebuild per fix means a 1.4 GB push.
      - ./scripts/osrelay.py:/usr/local/bin/osrelay.py:ro
      - ./scripts/warm-keepalive.sh:/usr/local/bin/warm-keepalive.sh:ro
      - ./scripts/warm-logins:/app/warm-logins:ro
      - ./scripts/osdrive.sh:/usr/local/bin/osdrive.sh:ro

  # ⭐ maker's Zazzle publisher, moved off office. Ben, Slack #unibrowse
  # 2026-10-15: "make sure that maker and apis can also be fully off office and
  # be on the headless". ⛔ RUN THIS ON server3, like `osdrive` and `warm`.
  #
  # ⛔ WHY NOT THE OS-INPUT RIG, which is what was actually asked for: maker's
  # publisher drives `browser_execute_macro` against a sidecar (measured in
  # maker/uploader/run.py, 2026-10-15), and macros are an EXTENSION feature.
  # `warm` and `osdrive` have no extension and no CDP ON PURPOSE, so they cannot
  # serve maker at any amount of effort. The PerimeterX story that motivated the
  # OS-input lane belongs to their OLD driver (uploader/zz.py, headless
  # Playwright) — the lane they already left.
  #
  # ⛔ chromium, NOT the branded-chrome image `warm` uses. Branded Google Chrome
  # REFUSES --load-extension, so the extension would never load and the
  # container would come up looking perfectly healthy with nothing connected.
  # This is office's own pinned chromium 150 image pushed to the LAN registry:
  # the Dockerfile can no longer be rebuilt (alpine dropped the pin) and the
  # browser version is part of the fingerprint maker's 50/day already survives.
  #
  # ⭐ /app/extension IS LOAD-BEARING AS A PATH, not merely as a mount. An
  # unpacked extension's id is sha256 of its DIRECTORY (chromium-host/server.js
  # :356), so mounting the same bytes anywhere else mints a DIFFERENT extension
  # id — and the copied profile's chrome.storage, which is where the server URL
  # lives, is keyed by that id. Move the path and the browser connects nowhere.
  #
  # ⚠️ EGRESS DOES NOT CHANGE BY MOVING HERE, and the plan should not assume it
  # does. MEASURED 2026-10-15 from both hosts and from inside the browser
  # itself: office and server3 share one WAN address (74.104.230.49). Zazzle
  # sees the IP it already sees; what moves is the dependency on office, not the
  # reputation of the address.
  # ⛔⛔ BRING IT UP BY NAME: `docker compose up -d sidecar-s3`.
  # NOT `docker compose --profile sidecar-s3 up -d` — a profile flag with no
  # service name ALSO starts every service that has no `profiles:` key, which
  # here is mongodb AND A SECOND mcp-server. On server3 that means a rival
  # control plane and a second Mongo against the same NAS. Caught 2026-10-15
  # when the "pull" it kicked off turned out to be mcp-server's image, not this
  # one; nothing was created, because the pulls were cancelled first.
  sidecar-s3:
    profiles: ["sidecar-s3"]
    image: 192.168.1.207:5050/unibrowse/chromium-host:2026-10-15
    container_name: unibrowse-sidecar-s3
    restart: unless-stopped
    init: true
    shm_size: 512m
    environment:
      PORT: 9020
      PROFILES_DIR: /app/.chrome-profiles
      EXTENSION_DIR: /app/extension
      CHROME_PATH: /usr/bin/chromium-browser
      TZ: America/New_York
    # ⭐⭐ THIS LINE IS WHY A COPIED SIDECAR PROFILE WORKS HERE AT ALL, and it
    # is also the cheapest half of tomorrow's mcp-server move. A sidecar
    # extension stores the server it dials inside its own chrome.storage, and on
    # office that value is the DOCKER NAME `mcp-server:9010` (extension/
    # background.js:5265 says so in as many words) — a name that resolves on
    # office's compose network and NOWHERE on server3. A profile copied here
    # would launch, look healthy, and connect to nothing.
    # ⇒ Resolve the name at the container instead of editing 12 browser
    # profiles: point it at whichever host runs mcp-server. ⚠️ CHANGE THIS IP
    # when :9010 moves to server4 (192.168.1.168) — that one edit re-points
    # every container sidecar without touching a single profile. Host desktop
    # browsers store a real IP and still need their options page.
    extra_hosts:
      - "mcp-server:192.168.1.199"
    # ⛔ BOUND TO LOOPBACK. :9020 spawns a browser for anyone who can reach it
    # and has no authentication of its own; the launch calls are made on server3
    # over ssh. ⛔ Do not publish it on the LAN address "for convenience".
    ports:
      - "127.0.0.1:9020:9020"
    volumes:
      # ⛔ The profiles live in a LOCAL volume: Chrome profiles are LevelDB plus
      # SQLite and both corrupt over NFS.
      - sidecar_s3_profiles:/app/.chrome-profiles
      # ⭐ …except the staging directory, which MUST be the NAS one. maker's
      # uploader container (on this same host) writes the design PNG there, and
      # the macro hands the browser /app/.chrome-profiles/zazzle-staging/<name>.
      # ⚠️ It is shared, not host-local — /staging in their container is this
      # same NAS path, which is how their server3 uploader already drives
      # office's sidecar.
      - ./chrome-profiles/zazzle-staging:/app/.chrome-profiles/zazzle-staging
      - ./extension:/app/extension:ro
      - ./chromium-host/server.js:/app/server.js:ro

networks:
  unibrowse-network:
    driver: bridge

volumes:
  # Profiles for the server3 sidecar (maker's zazzle browser). ⛔ Local, never
  # the NAS: LevelDB and SQLite both corrupt over NFS. ⚠️ It holds a logged-in
  # Zazzle seller session, so a `down -v` on server3 costs maker a re-login.
  sidecar_s3_profiles:
    driver: local
  # ⚠️ HOST-LOCAL, and that is the point: it lives on whichever host runs the
  # osdrive profile, which is server3. It holds the logged-in Fiverr, Upwork
  # and Freelancer sessions, so losing it means re-logins that need Ben for ID
  # and 2FA. ⛔ Do not `docker compose down -v` this host.
  osdrive_profile:
    driver: local
  # ⛔⛔ THE MOST EXPENSIVE VOLUME ON THIS NETWORK TO LOSE. It holds the warm
  # Amazon / eBay / DoorDash sessions, their saved cards and addresses. It is
  # host-local to server3 and there is no backup — losing it means re-logins
  # that need Ben for every 2FA code. ⛔ Never `docker compose down -v` here.
  warm_profile:
    driver: local
  slipway_state:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
