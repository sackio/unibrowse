version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: unibrowse-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: unibrowse
    ports:
      - "127.0.0.1:27018:27017"  # Expose MongoDB on localhost:27018 to avoid conflicts
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - unibrowse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unibrowse-mcp-server
    restart: unless-stopped
    # tini as PID 1 reaps zombies + propagates SIGTERM to children, so child
    # chromium processes get a graceful close window before docker's 10s
    # SIGKILL deadline. Without this, docker compose restart silently
    # SIGKILL'd every spawned chromium when node's main process didn't
    # forward signals down the tree (observed 8 chromium deaths today).
    init: true
    ports:
      - "127.0.0.1:9010:9010"  # localhost
      - "192.168.1.199:9010:9010"  # LAN access from server4/server5
    environment:
      PORT: 9010
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: unibrowse
      NODE_ENV: production
      RECORDINGS_DIR: /app/recordings
      # Where browser_fetch_to_server stores bytes pulled out of a driven
      # browser. Ben chose the destination 2026-09-12: "~/files is fine".
      # ⚠️ That is /home/ben/files on OFFICE, and /home/ben is HOST-LOCAL — the
      # same path holds different content on each host. This service runs only
      # on office, so it resolves; do not copy this mount to another host's
      # compose file and assume it means the same directory.
      # ⭐ Deliberately NOT the repo's own ./fetched: that sits on the NAS,
      # which is shared fleet-wide, so every agent seat would read whatever
      # landed there. Host-local is the weaker exposure and costs nothing.
      FETCHED_DIR: /app/fetched
      # ⛔ THE URL WE HAND TO OTHER PEOPLE — not this process's bind address.
      # Two features mail a link out of this container: a parked oversized
      # send body (/shared/:id) and a shared recording's replay page
      # (/review/:id). The default, `http://mcp-server:9010`, is the compose
      # service name: it resolves inside this network and NOWHERE else, so a
      # recipient on any other host gets a link that fails DNS. Nothing errors
      # at send time — the message is delivered, correctly, containing a URL
      # only we can open.
      # ⚠️ LAN address, not localhost: recipients are agent seats on office,
      # server4 and server5. Matches the second port binding above.
      UNIBROWSE_PUBLIC_URL: ${UNIBROWSE_PUBLIC_URL:-http://192.168.1.199:9010}
      # Comma-separated list of valid API keys. Empty/unset = open mode (auth disabled).
      # When set: /ws + /install/extension.zip + /api/v1/recordings/* require a valid
      # key for REMOTE clients (LAN clients never need one). /mcp is LAN-only (403 for
      # remote, even with a key). See src/utils/auth.ts.
      UNIBROWSE_API_KEYS: ${UNIBROWSE_API_KEYS:-}
      # Extra reverse-proxy peer IPs to trust for X-Forwarded-For (comma-separated).
      # Required when the public TLS proxy is on another host (server4 nginx →
      # office:9010): the container sees server4's LAN NIC as the peer, so it must be
      # trusted here or its XFF (which marks the traffic remote) is ignored.
      # ⛔ SECURITY CONTROL — emptying this exposes /mcp (arbitrary browser
      # control) to the internet, silently and with no error. Public traffic
      # arrives via nginx on server4 whose peer address is PRIVATE; only its
      # membership here makes us read the X-Forwarded-For that classifies that
      # traffic as REMOTE. Drop it and every public visitor is treated as LAN.
      # Read EXTRA_TRUSTED_PROXIES in src/utils/auth.ts before changing this.
      UNIBROWSE_TRUSTED_PROXIES: ${UNIBROWSE_TRUSTED_PROXIES:-}
      # When set, browser_launch_isolated_chrome POSTs to the chromium-host
      # sidecar instead of spawning chromium in-process. Decouples chromium
      # lifecycle from mcp-server lifecycle — restarts of this service no
      # longer touch running chromiums. Unset = legacy in-process spawn
      # (still supported as fallback during the rollout). Set to e.g.
      # http://chromium-host:9020 after `docker compose --profile chromium-host up`.
      UNIBROWSE_CHROMIUM_HOST: ${UNIBROWSE_CHROMIUM_HOST:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - unibrowse-network
    volumes:
      # Mount for development (optional - remove in production)
      - ./dist:/app/dist:ro
      # Extension code mounted read-only so changes to extension/*.js take
      # effect on the next container chromium relaunch — no rebuild needed.
      - ./extension:/app/extension:ro
      # Chromium profiles persist across container recreates (e.g. compose
      # changes). Without this, `/app/.chrome-profiles` lives in the writable
      # layer and gets wiped on `up -d --force-recreate`, taking accumulated
      # Auth0 / login session cookies with it. Bind-mounting to host preserves
      # them and lets host-side tooling (backups, rsync) reach them too.
      - ./chrome-profiles:/app/.chrome-profiles
      # Persistent video recordings storage
      - ./recordings:/app/recordings
      # Files retrieved from a driven browser's authenticated session.
      # Host-local (see FETCHED_DIR above), not the NAS-backed repo dir.
      - ${FETCHED_HOST_DIR:-/home/ben/files}:/app/fetched

  # Chromium-host sidecar — opt-in via `docker compose --profile chromium-host up`.
  # Hosts spawned chromiums in a SEPARATE container so mcp-server lifecycle
  # (restart, recreate, code reload) never touches running chromiums. Filed as
  # the architectural fix on 2026-06-02 after 8 chromium SIGKILL events from
  # mcp-server restarts. Plan author: Plan agent. See chromium-host/server.js.
  chromium-host:
    profiles: ["chromium-host"]
    build:
      context: ./chromium-host
      dockerfile: Dockerfile
    container_name: unibrowse-chromium-host
    restart: unless-stopped
    init: true
    environment:
      PORT: 9020
      PROFILES_DIR: /app/.chrome-profiles
      EXTENSION_DIR: /app/extension
    networks:
      - unibrowse-network
    volumes:
      # Same bind mounts as mcp-server so profiles and extension code are
      # shared. The chromium-host is the WRITER of profiles (mcp-server only
      # reads or, when in legacy mode, also writes — but with the side-container
      # active, the launcher delegates writes here).
      - ./chrome-profiles:/app/.chrome-profiles
      - ./extension:/app/extension:ro

networks:
  unibrowse-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
